# Let the project's .htaccess files protect core/, database/ and uploads/private/.
<Directory /var/www/html/>
    Options -Indexes
    AllowOverride All
</Directory>

# Railway handles HTTPS before the request reaches Apache. This tells PHP the
# visitor is on HTTPS, so login cookies are marked secure.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

ServerName localhost
